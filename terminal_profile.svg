    </text>

    <!-- Industry line 1 -->
    <text x="0" y="262" class="text">
      <tspan class="bold pink">Industry:</tspan>
      <tspan class="white">
        System Design, Software Development, Web Development,
      </tspan>
    </text>

    <!-- Industry line 2 -->
    <text x="97" y="287" class="text white">
