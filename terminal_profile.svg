    <!-- Email -->
    <text x="0" y="497" class="text">
      <tspan class="bold orange">Email:</tspan>
      <tspan class="white"> hasnatimtiaz949@gmail.com</tspan>
    </text>

    <!-- LinkedIn -->
    <text x="0" y="523" class="text">
      <tspan class="bold orange">LinkedIn:</tspan>
      <tspan class="white">
        muhammad-hasnat-imtiaz-817647310
      </tspan>
    </text>

    <!-- GitHub -->
    <text x="0" y="549" class="text">
      <tspan class="bold orange">GitHub:</tspan>
      <tspan class="white"> Hasnat-code</tspan>
    </text>

  </g>
</svg>
