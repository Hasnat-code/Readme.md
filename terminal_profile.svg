    </text>

    <!-- Industry line 3 -->
    <text x="97" y="312" class="text white">
      Software Testing
    </text>

    <!-- Tools heading -->
    <text x="0" y="351" class="text bold green">
      Tools
    </text>

    <!-- AI -->
