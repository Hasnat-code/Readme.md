<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  width="1536"
  height="730"
  viewBox="0 0 1536 730"
>
  <style>
    .text {
      font-family: "Courier New", Consolas, monospace;
      font-size: 16px;
      fill: #e6e6e6;
    }

    .normal {
      font-weight: 400;
    }

    .bold {
      font-weight: 700;
    }

    .green {
      fill: #42ff76;
    }

    .yellow {
      fill: #f1e766;
    }

    .cyan {
      fill: #65ddff;
    }

    .purple {
      fill: #ce7cff;
    }

    .pink {
      fill: #ff5fd2;
    }

    .orange {
      fill: #ffb04f;
    }

    .white {
      fill: #e8e8e8;
    }

    .divider {
      stroke: #555b61;
      stroke-width: 1;
      stroke-dasharray: 5 6;
    }
  </style>

  <!-- Terminal background -->
  <rect width="1536" height="730" fill="#0d0e0f" />

  <!-- Left-side PNG -->
  <image
    href="./ascii_art.png"
    x="18"
    y="20"
    width="705"
    height="690"
    preserveAspectRatio="xMidYMid meet"
  />

  <!-- Right-side content -->
  <g transform="translate(775,45)">

    <!-- Username -->
    <text x="0" y="12" class="text bold green">
      hasnat@dev
    </text>

    <!-- Top divider -->
    <line x1="0" y1="33" x2="425" y2="33" class="divider" />

    <!-- Role -->
    <text x="0" y="61" class="text">
      <tspan class="bold orange">Role:</tspan>
      <tspan class="white"> Software Engineering Student</tspan>
    </text>

    <!-- Focus -->
    <text x="0" y="87" class="text">
